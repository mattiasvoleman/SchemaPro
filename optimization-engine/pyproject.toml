[project]
name = "schemapro-optimization-engine"
version = "1.0.0"
description = "SchemaPro CP-SAT scheduling microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "ortools>=9.11.4210,<10.0.0",
    "structlog>=24.4.0,<25.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The benchmark suite is a wall-clock measurement, not a correctness test; it
# runs in its own CI job so a slow machine never fails the unit gate.
norecursedirs = ["benchmarks", ".venv"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/logging_config.py"]

[tool.coverage.report]
# §2 sets ≥95% line coverage across all packages. `--cov-fail-under` on the
# command line overrides this when the gate is being ratcheted deliberately.
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

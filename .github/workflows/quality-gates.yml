name: Quality Gates

# The slow half of the §2 metric table. These gates take tens of minutes
# (mutation testing re-runs the suite once per mutant; the solver benchmark and
# Lighthouse are wall-clock measurements that need a quiet machine), so they run
# nightly and on demand rather than on every pull request.
#
# The mutation, Lighthouse, solver and API latency jobs are hard gates: each
# exits non-zero when its threshold is missed. The mutation gate measures a
# slice of the API a night, not all of it, against that slice's own floor (see
# the mutation job). The visual-baselines job,
# dispatch-only, regenerates the Linux screenshot baselines for review and gates
# no code. Printed beside the gates and deciding nothing: api-latency's §2
# milliseconds on every row, its reads' and floor's share of health and its
# write ratios — the write against its interleaved baseline until ten runs have
# calibrated a threshold for it (docs/verification-baseline.md) — and the
# solver job's 2,000-student §2 figure, reported after its 400-student gate.
#
# Actions are pinned to commit SHAs for the same reason as in ci.yml — a `@v5`
# tag is a pointer somebody else can move — with the release name kept in the
# trailing comment. That file's header has the command for resolving a new pin.
# Resolved 2026-08-22.

on:
  schedule:
    # 02:30 UTC — outside European working hours, so runners are less contended
    # and the latency/solver numbers are comparable night to night.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      run_mutation:
        description: 'Run mutation testing (slow)'
        type: boolean
        default: true
      # Which slice of the API the mutation job takes: a number, a comma list
      # of numbers ('3,7'), 'all' for every slice (one job each, ten at a time),
      # or empty for tonight's, the day of the year (UTC) modulo the number of
      # slices in scripts/mutation-slices.json.
      mutation_slice:
        description: "Mutation slice: a number, a comma list, 'all', or empty for tonight's"
        type: string
        default: ''
      # A one-off measurement: the api-latency job alone, the other four jobs
      # skipped so the dispatch bills one job. (It once also switched the
      # authenticated-read floor rounds on; they run every night now, being
      # the gate's denominator, and the input keeps its name for whoever
      # dispatches it.) On schedule `inputs` is empty, so every condition
      # below is what it was and the nightly run is unchanged.
      latency_floor:
        description: 'Run only the API latency job'
        type: boolean
        default: false

# Nothing here writes to the repository: the artifacts go through the runtime
# token that upload-artifact uses, not GITHUB_TOKEN. The mutation job runs
# mutated code and an unpinned `npm install`; its token reads and no more.
permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual-baselines:
    name: Regenerate visual baselines (native runner)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !inputs.latency_floor
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 24, as in ci.yml's web job: the two workflows build and test the
      # same package, so a version that differs here gates code on a runtime
      # the pull-request gate never proved. Change them together.
      # web/package.json requires Node >=22.10 (jsdom 30's undici needs
      # node:worker_threads' markAsUncloneable), and 24 is what the suite is
      # developed against.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web

      # Baselines MUST be produced by the same machine that verifies them.
      # Generating them elsewhere has failed three times: macOS instead of
      # Linux, then arm64 instead of amd64, then QEMU-emulated amd64 instead of
      # native — Skia and FreeType pick SIMD paths from runtime CPU feature
      # detection, so even the right OS and architecture under emulation can
      # rasterise text differently. This job removes the guesswork.
      - name: Regenerate
        run: npx playwright test --project=visual --project=visual-mobile --update-snapshots=all
        working-directory: web

      # Verify the freshly written files actually match on a second pass,
      # rather than trusting that writing them was enough.
      - name: Verify against themselves
        run: npx playwright test --project=visual --project=visual-mobile
        working-directory: web

      # Uploaded rather than committed: pushing to the default branch from CI
      # needs write permissions this workflow should not hold, and a baseline
      # change deserves a human looking at the images.
      - name: Upload baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines-linux-x64
          path: web/e2e/visual.spec.ts-snapshots/*-linux-x64.png
          retention-days: 14

  # Which slices this run takes, as a matrix for the job below: tonight's one
  # on the schedule, the ones asked for on a dispatch, or all of them. The
  # script's plan mode imports nothing and reads the number of slices from the
  # checked-in dealing, but the script as a whole wants Node 22 (fs.globSync),
  # so the job sets it up as the mutation job does.
  #
  # The inputs reach the script through env, never pasted into its text: an
  # expression is pasted before bash parses it, so a quote in the value would
  # close the argument and the rest would run as shell.
  mutation-plan:
    name: API — mutation, which slices
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' || inputs.run_mutation) && !inputs.latency_floor
    timeout-minutes: 5
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
      of: ${{ steps.plan.outputs.of }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # pipefail: a plan that fails must fail the step, and not leave `slices`
      # empty for the next job's matrix to choke on.
      - name: Plan
        id: plan
        env:
          MUTATION_SLICE: ${{ inputs.mutation_slice }}
        run: |
          set -o pipefail
          node scripts/mutation-slice.mjs --plan | tee -a "$GITHUB_OUTPUT"

  # One slice of the API per job. On 2026-10-06 this job mutated 57 files and
  # 7,522 mutants in 41 minutes; on 2026-11-02 it was 280 files and 73,861
  # mutants, the runner got through 10,097 in the 90 minutes and the job was
  # cancelled. scripts/mutation-slices.json deals the files into slices by the
  # seconds each was measured to cost, and gives each slice a floor, its
  # measured score minus a point, which is what the job fails under. §2's 85%
  # stays the target and is printed beside it.
  mutation:
    name: API — mutation score, slice ${{ matrix.slice }} of ${{ needs.mutation-plan.outputs.of }} (against its floor)
    needs: mutation-plan
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' || inputs.run_mutation) && !inputs.latency_floor
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # A night is one slice. A dispatch of 'all' is as many jobs as there are
      # slices, and the runner pool is shared with ci.yml's pull-request jobs.
      max-parallel: 10
      matrix:
        slice: ${{ fromJSON(needs.mutation-plan.outputs.slices) }}
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      MUTATION_SLICE: ${{ matrix.slice }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Node 22, as in ci.yml's API jobs: the two workflows build and test the
      # same package, so a version that differs here gates code on a runtime
      # the pull-request gate never proved. Change them together.
      # @supabase/supabase-js 2.110 requires Node >=22 (package.json engines
      # say the same) because it needs a native WebSocket global, and
      # SupabaseAdminService calls createClient() in its constructor.
      #
      # On Node 20 this job failed every night from 2026-08-09 in Stryker's
      # initial test run ("Node.js detected but native WebSocket not found")
      # and never reached a mutant.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 22 still bundles npm 10 (10.9.8 in the runner's
      # 22.23.2), and npm 10 and 11 resolve optional peer dependencies
      # differently and produce mutually incompatible lockfiles: an npm 11 lock
      # fails npm 10 with "Missing @swc/helpers", and an npm 10 lock fails
      # npm 11 with "Missing @parcel/watcher-*". Whichever npm generates the
      # committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run prisma:generate

      # `test:mutation` installs Stryker with --no-save. It is deliberately not
      # a committed devDependency: its transitive typed-rest-client → qs chain
      # carries moderate advisories, which would make the §2 security gate fail
      # on a tool that ships nothing. Keeping it out of the lockfile lets
      # `npm audit` stay at zero-tolerance instead of needing an exception.
      #
      # The script sets `thresholds.break` to the slice's floor in the config it
      # writes for the run, which Stryker applies to the mutants it was given —
      # the slice — so the run itself fails under the floor and only then. It
      # prints the slice's files first, writes the slice's number, score, floor
      # and every file's score to the job summary, and exits with Stryker's code.
      - name: Stryker
        run: npm run test:mutation

      # The slice's number is in the artifact's name and in every path inside
      # it, so ten nights can be set side by side.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-slice-${{ matrix.slice }}
          path: reports/mutation/
          # A run that wrote nothing measured nothing: the step is red, not a warning.
          if-no-files-found: error
          retention-days: 30

  lighthouse:
    name: Web — Lighthouse (LCP/TTI/a11y)
    runs-on: ubuntu-latest
    # Wrapped in ${{ }}: a YAML value that opens with `!` is a tag.
    if: ${{ !inputs.latency_floor }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 24, as in ci.yml's web job: the two workflows build and test the
      # same package, so a version that differs here gates code on a runtime
      # the pull-request gate never proved. Change them together.
      # web/package.json requires Node >=22.10 (jsdom 30's undici needs
      # node:worker_threads' markAsUncloneable), and 24 is what the suite is
      # developed against.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pin npm explicitly. Node 24 bundles npm 11 today (11.19.0 in the runner's
      # 24.20.0), but which npm installs must not depend on which Node release
      # setup-node resolves. npm 10 and 11 resolve optional peer dependencies
      # differently and produce mutually incompatible lockfiles: an npm 11 lock
      # fails npm 10 with "Missing @swc/helpers", and an npm 10 lock fails
      # npm 11 with "Missing @parcel/watcher-*". Whichever npm generates the
      # committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run build

      # Thresholds and the Slow-4G throttling profile live in lighthouserc.json.
      # @lhci/cli runs via npm exec rather than as a devDependency: its
      # lighthouse → @sentry/node → cookie chain carries a critical advisory,
      # which would fail the §2 security gate on a tool that ships nothing.
      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-results
          path: web/.lighthouseci/
          include-hidden-files: true
          retention-days: 30

  solver-benchmark:
    name: Solver — generation gate & §2 report
    runs-on: ubuntu-latest
    if: ${{ !inputs.latency_floor }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: optimization-engine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: optimization-engine/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # The GATE asserts what the solver achieves today, ratchet-style: a
      # 400-student school must yield a schedule that passes independent
      # rule-by-rule validation. 90s rather than §2's 10s because CI runners
      # are 2-4x slower than the dev hardware the 10s figure is measured on,
      # and this job exists to catch regressions (e.g. an encoding change
      # that stops the solver finding anything), not to restate the target.
      - name: "Gate: 400 students produce a valid schedule"
        run: PYTHONPATH=. python benchmarks/validate_schedule.py --students 400 --budget 90

      # The §2 target — 2,000 students under 10s — is REPORTED, not gated. It
      # is measured honestly since the complexity-guard fix (previously the
      # payload was rejected before solving); the current truth is TIMEOUT,
      # tracked in docs/verification-baseline.md. Asserting it here would make
      # this job permanently red, which trains people to ignore red.
      - name: "Report: the 2,000-student §2 figure"
        run: >-
          PYTHONPATH=. python benchmarks/solve_2000_students.py
          --students 2000 --json

  api-latency:
    name: API — latency (read share ≥ 0.80 of the authenticated floor)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: postgres_local
      # The benchmark mints HS256 service tokens, so it never reaches the JWKS
      # endpoint — but the issuer is required and is verified on every request,
      # and mint-token.mjs stamps this same value into the `iss` claim.
      JWT_SECRET: ci-benchmark-secret-not-used-anywhere-else
      JWT_ISSUER: https://ci.invalid/auth/v1
      JWT_AUDIENCE: schemapro-api
      # Must be ≥32 chars: Settings.validate_api_key_strength in the solver
      # rejects anything shorter and the container exits at startup.
      AI_ENGINE_API_KEY: ci-benchmark-shared-key-not-a-secret-0000
      # The dev default is 120 req/60s. The benchmark drives ~450 req/s by
      # design, so without this ~99% of responses are 429 and the run measures
      # the throttler, not the API. api-latency.mjs fails on >1% non-2xx rather
      # than reporting the flattering number that produces.
      THROTTLE_LIMIT: "10000000"
      DATABASE_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
      DIRECT_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22, as in ci.yml's API jobs: the two workflows build and test the
      # same package, so a version that differs here gates code on a runtime
      # the pull-request gate never proved. Change them together.
      # @supabase/supabase-js 2.110 requires Node >=22 (package.json engines
      # say the same) because it needs a native WebSocket global, and
      # SupabaseAdminService calls createClient() in its constructor.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 22 still bundles npm 10 (10.9.8 in the runner's
      # 22.23.2), and npm 10 and 11 resolve optional peer dependencies
      # differently and produce mutually incompatible lockfiles: an npm 11 lock
      # fails npm 10 with "Missing @swc/helpers", and an npm 10 lock fails
      # npm 11 with "Missing @parcel/watcher-*". Whichever npm generates the
      # committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run prisma:generate

      # Which CPU the runner drew, printed so that a night's numbers can be
      # grouped with the nights that drew the same one. ubuntu-latest is a
      # mixed pool: of 35 runners one day, 19 were an EPYC 7763, 9 a 9V74, 6 a
      # 9V45 and one a Xeon 8573C, all with 4 vCPUs, and health ran 2.5× faster
      # on one model against reads only 1.6× faster
      # (docs/verification-baseline.md).
      - name: Runner
        run: lscpu | grep -E 'Model name|^CPU\(s\)'

      # Latency against a mocked Prisma layer is meaningless — the RLS
      # transaction and policy evaluation are the cost being measured, so the
      # benchmark needs the real stack.
      - name: Start stack
        run: docker compose up --build -d --wait

      # Seeding runs on the host, not `docker compose run api`. The runtime
      # image is a hardened production build: it has no writable home
      # (npm fails with EACCES /home/appuser) and dev dependencies are pruned,
      # so ts-node and the seed script are not present in it at all.
      - name: Seed
        run: npm run db:seed

      # Emits the admin authId, an academicYearId and an attendance payload.
      # Without them the benchmark skips both reads and the write. api-latency.mjs
      # would call that run invalid rather than pass it, but this step fails
      # first and says why.
      - name: Benchmark fixtures
        id: fixtures
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U postgres -d schemapro \
            -v ON_ERROR_STOP=1 -tA -f /dev/stdin \
            < scripts/bench/fixtures.sql > /tmp/fixtures.txt

          # Keyed, not line-indexed: psql prints a command tag for the
          # data-modifying statement in the fixture, which shifts line numbers.
          auth_id="$(sed -n 's/^authId=//p'         /tmp/fixtures.txt)"
          year_id="$(sed -n 's/^academicYearId=//p' /tmp/fixtures.txt)"
          body="$(sed -n 's/^writeBody=//p'         /tmp/fixtures.txt)"

          if [ -z "$auth_id" ] || [ -z "$year_id" ] || [ -z "$body" ]; then
            echo "fixtures incomplete — is the database seeded?" >&2
            echo "  authId='${auth_id}' year='${year_id}' body='${body}'" >&2
            cat /tmp/fixtures.txt >&2
            exit 1
          fi

          printf '%s' "$body" > /tmp/write-body.json
          echo "academic_year=${year_id}" >> "$GITHUB_OUTPUT"
          echo "token=$(node scripts/bench/mint-token.mjs --sub "$auth_id")" >> "$GITHUB_OUTPUT"

      # autocannon is installed --no-save for the same reason as Stryker: its
      # transitive deps carry moderate advisories and it ships nothing.
      #
      # No `${{ }}` reaches the script text: the fixture outputs arrive through
      # env. An expression is pasted into the script before bash parses it, so a
      # quote in the value would close the argument and the rest would run as
      # shell; a variable expands after parsing and stays one argument. The
      # outputs carry what the fixture query read from the database — a
      # base64url JWT and a UUID today, neither able to hold a quote — and
      # staying safe should not rest on the value being one.
      - name: Benchmark
        env:
          TOKEN: ${{ steps.fixtures.outputs.token }}
          ACADEMIC_YEAR: ${{ steps.fixtures.outputs.academic_year }}
        run: >-
          npm install --no-save --no-audit --no-fund autocannon@^8 &&
          node scripts/bench/api-latency.mjs
          --url http://localhost:4000
          --token "$TOKEN"
          --academic-year "$ACADEMIC_YEAR"
          --write-body /tmp/write-body.json
          --duration 20 --connections 25

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

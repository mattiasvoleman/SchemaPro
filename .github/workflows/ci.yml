name: CI

# Every `uses:` below names a commit SHA, not a tag. A tag is a movable pointer
# in somebody else's repository: `@v5` is whatever that owner pushed last, and
# a compromised or retagged release runs with this workflow's token and secrets.
# The trailing comment is the release each SHA was resolved from — keep the two
# in step when bumping a pin, or the file stops being readable:
#   git ls-remote https://github.com/actions/checkout refs/tags/v5 'refs/tags/v5^{}'
# The second, peeled ref is what an annotated tag points at; when it prints
# nothing the tag is lightweight and the first line is already the commit.
# Resolved 2026-08-22.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, tests & coverage
    runs-on: ubuntu-latest
    env:
      # `prisma validate` resolves env("DATABASE_URL") / env("DIRECT_URL");
      # placeholder values are enough — nothing connects to a database in CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # §2 mandates ≥95%, which remains the target. jest.base.js carries
      # per-metric ratchet floors just under what the suite achieves today, so
      # the gate blocks regression rather than failing on a known gap. Set the
      # COVERAGE_MIN repository variable (or the per-metric ones) to raise them
      # from here without a code change.
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '' }}
      COVERAGE_MIN_LINES: ${{ vars.COVERAGE_MIN_LINES || '' }}
      COVERAGE_MIN_STATEMENTS: ${{ vars.COVERAGE_MIN_STATEMENTS || '' }}
      COVERAGE_MIN_FUNCTIONS: ${{ vars.COVERAGE_MIN_FUNCTIONS || '' }}
      COVERAGE_MIN_BRANCHES: ${{ vars.COVERAGE_MIN_BRANCHES || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22+: @supabase/supabase-js needs a native WebSocket global, which
      # Node 20 lacks — createClient() throws at construction. Matches the
      # runtime floor in package.json engines and the API Dockerfile.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck (production sources)
        run: npm run typecheck

      - name: Typecheck (test sources)
        run: npm run typecheck:test

      # Unit + e2e in one run so the reported coverage is the combined figure
      # §2 gates on. Both exercise a mocked Prisma layer — no database needed.
      - name: Unit + integration tests with coverage
        run: npm run test:cov

      # The verdict of quality-gates.yml's nightly latency job, run on the rows
      # of five real CI runs. latency-gate.mjs imports nothing, so this needs
      # neither autocannon nor the stack, and a change to the gate is proven on
      # the pull request rather than first at night.
      - name: Latency gate verdict (node:test)
        run: node --test scripts/bench/latency-gate.test.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-coverage
          path: coverage/
          retention-days: 14

  web:
    name: Web — typecheck, build, bundle & browser gates
    runs-on: ubuntu-latest
    env:
      # Placeholder values so `next build` can prerender; real values are
      # injected at deploy time. Never commit real keys.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 24, not 20 like the other jobs: the Vitest suite runs jsdom 30,
      # whose undici 8 does an unguarded
      #   const { markAsUncloneable } = require('node:worker_threads')
      # at import time. That binding only exists from Node 22.10, so on Node 20
      # every jsdom worker dies with "webidl.util.markAsUncloneable is not a
      # function" before a single test runs. 24 is the active LTS and the
      # version the suite is developed against.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      # Vitest unit/component suite with the coverage ratchet. Floors live in
      # vitest.config.ts; raise them via the WEB_COVERAGE_MIN* repository
      # variables as coverage grows — same pattern as the API's jest.base.js.
      - name: Unit tests with coverage
        run: npm run test:unit:cov
        working-directory: web
        env:
          WEB_COVERAGE_MIN: ${{ vars.WEB_COVERAGE_MIN || '' }}
          WEB_COVERAGE_MIN_LINES: ${{ vars.WEB_COVERAGE_MIN_LINES || '' }}
          WEB_COVERAGE_MIN_STATEMENTS: ${{ vars.WEB_COVERAGE_MIN_STATEMENTS || '' }}
          WEB_COVERAGE_MIN_FUNCTIONS: ${{ vars.WEB_COVERAGE_MIN_FUNCTIONS || '' }}
          WEB_COVERAGE_MIN_BRANCHES: ${{ vars.WEB_COVERAGE_MIN_BRANCHES || '' }}

      - name: Build
        run: npm run build
        working-directory: web

      # Tiered budgets on each route's OWN JavaScript, plus a separate budget
      # on the shared framework runtime. §2 specifies a flat 150KB on the total
      # payload, which no route can meet: the framework floor alone is 126KB of
      # react-dom, the Next App Router client and the Turbopack runtime, none
      # of it application code. See the TIERS comment in the script.
      #
      # `npm run bench:bundle:flat` still reports the §2 figure verbatim.
      - name: Bundle size budget
        run: node scripts/bench/bundle-size.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      # §2: WCAG 2.1 AA, zero automated violations.
      - name: Accessibility (axe-core)
        run: npx playwright test --project=a11y
        working-directory: web

      - name: Functional smoke
        run: npx playwright test --project=smoke
        working-directory: web

      # §2: ≤0.1% pixel variance. Baselines are committed and must match the
      # Linux renderer — regenerate them in a Linux container, not on macOS.
      - name: Visual regression
        run: npx playwright test --project=visual --project=visual-mobile
        working-directory: web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-playwright-report
          path: web/playwright-report/
          retention-days: 14

  solver:
    name: Solver — pytest & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimization-engine
    env:
      # §2 mandates ≥95%, which remains the target. 81 is a ratchet floor at
      # what the suite achieves today (measured on python:3.12 with the current
      # requirements), so the gate blocks regression rather than failing
      # permanently. Raise it via the ENGINE_COVERAGE_MIN repository variable
      # as coverage grows; never lower it to green a build.
      #
      # The margin is thin — actual is 81.28% — so a small uncovered addition
      # will trip this. That is the intended behaviour, not a misconfiguration.
      COVERAGE_MIN: ${{ vars.ENGINE_COVERAGE_MIN || '81' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: optimization-engine/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: >-
          python -m pytest -q
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=${COVERAGE_MIN}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solver-coverage
          path: optimization-engine/coverage.xml
          retention-days: 14

  rls:
    name: Database — row-level-security policies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: postgres_local
      # docker-compose.yml declares JWT_SECRET and JWT_ISSUER with `:?`, so
      # compose refuses to interpolate the file without them — even though only
      # the `db` service is started here and nothing reads them.
      JWT_SECRET: ci-rls-secret-not-used-anywhere-else
      JWT_ISSUER: https://ci.invalid/auth/v1
      # Migrations run as the owner; the RLS assertions then connect as
      # app_authenticated, which is the whole point of the gate.
      DATABASE_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
      DIRECT_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22+: @supabase/supabase-js needs a native WebSocket global, which
      # Node 20 lacks — createClient() throws at construction. Matches the
      # runtime floor in package.json engines and the API Dockerfile.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run prisma:generate

      # This gate exists because the e2e suite mocks PrismaService and so
      # cannot see the database contract at all. Three production-breaking
      # bugs shipped behind that blind spot: missing table grants, an identity
      # lookup returning zero rows under RLS, and the SS12000 API silently
      # returning empty payloads. All three are asserted against here.
      #
      # Postgres only. Migrations and seeding run from the host rather than
      # through the `migrate` compose service, for two reasons:
      #
      #   1. `docker compose up --wait db migrate` does NOT wait for a one-shot
      #      container to *finish* — only to be running. Nothing here depends on
      #      migrate's completion the way the `api` service does
      #      (`condition: service_completed_successfully`), so the seed raced
      #      ahead of the migrations and failed with
      #      "The column `requiresApproval` does not exist in the current
      #      database" — a table from the initial migration, a column from a
      #      later one. It passed locally purely because the apply won the race.
      #   2. Using the compose service means building the whole API image just
      #      to run `prisma migrate deploy`, which the host can do directly.
      - name: Start database
        run: docker compose up -d --wait db

      - name: Apply migrations and seed
        run: |
          npm run migrate:deploy
          npm run db:seed

      - name: RLS policy assertions
        run: ./scripts/test/run-rls-tests.sh

      - name: Database logs
        if: failure()
        run: docker compose logs db --no-color --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v

  security:
    name: Security — dependency audit & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22+: @supabase/supabase-js needs a native WebSocket global, which
      # Node 20 lacks — createClient() throws at construction. Matches the
      # runtime floor in package.json engines and the API Dockerfile.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # §2 allows 0 Critical / High / Medium. npm audit's lowest failing level
      # is `moderate`, which is npm's name for Medium.
      - name: npm audit (API)
        run: npm audit --audit-level=moderate

      - name: npm audit (web)
        run: npm audit --audit-level=moderate
        working-directory: web

      # Same failing threshold as plain `npm audit --audit-level=moderate`,
      # plus a documented, EXPIRING allowlist for advisories that have no
      # patched release anywhere (npm audit itself cannot ignore a specific
      # advisory, and dropping the level would hide future findings too).
      # Suppressions are printed on every run and go red again at expiry —
      # see scripts/security/audit-allowlist.json for the justifications.
      - name: npm audit (mobile)
        run: node scripts/security/npm-audit-gate.mjs mobile

      - name: pip-audit (solver)
        run: |
          # Pinned like everything else here. The advisory data is fetched at
          # run time, so a fixed scanner version still sees today's CVEs.
          pip install pip-audit==2.10.1
          pip-audit --requirement optimization-engine/requirements.txt --strict

      # Static analysis across every package. `--error` makes any finding fail
      # the job; the rulesets cover OWASP Top 10 patterns for TS/JS and Python.
      #
      # The engine runs as a plain container, not through semgrep/semgrep-action.
      # That action is deprecated and starts returntocorp/semgrep-agent:v1, whose
      # Semgrep 1.36.0 cannot read today's registry rules: it raised `invalid
      # rule severity value: MEDIUM`, the container still exited 0, and the step
      # went green having scanned nothing (job 104116906318). Here semgrep is
      # the container's own process and `run:` executes under `bash -e`, so any
      # non-zero exit fails the step — a finding, a config the engine rejects,
      # rules it cannot fetch, an engine that is killed.
      #
      # Pinned to the multi-arch index digest. The tag in front only names the
      # release the digest was resolved from; Docker pulls by the digest. To
      # bump, take the top-level Digest from
      #   docker buildx imagetools inspect semgrep/semgrep:<version>
      # Resolved 2026-09-15. The same command reproduces the gate locally, run
      # in a `git archive HEAD` export: a working tree carries node_modules and
      # build output that this checkout never has.
      #
      # Keep the mount at /src. The checkout belongs to the runner's user and
      # semgrep runs as root, so git would call the repository dubiously owned;
      # the image's /root/.gitconfig trusts exactly /src, which is what lets
      # semgrep list the tracked files. Mounted anywhere else the scan exits 2.
      - name: Semgrep SAST
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
          semgrep scan
          --config=p/owasp-top-ten
          --config=p/typescript
          --config=p/javascript
          --config=p/python
          --config=p/secrets
          --config=p/nestjs
          --config=p/react
          --error --metrics=off

  mobile:
    name: Mobile — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      # The app holds attendance for real children in an offline queue on a
      # tablet several teachers share, and a mistake there is invisible until
      # the register is already wrong. It went untested for far too long.
      # Through the script, not `npx jest` directly: the script carries the
      # `TZ=UTC` pin, and a date test that agrees with the runner's own zone
      # compares a value to itself.
      - name: Unit tests
        run: npm run test:cov -- --ci

      # Nothing in this pipeline had ever bundled the app, and so nothing
      # noticed when mobile/package.json stopped describing it. expo-router
      # imports react-native-safe-area-context, expo-linking and
      # react-native-screens at runtime; two were absent from the manifest
      # altogether and the third was held a whole major back by an `overrides`
      # line. Neither gate above can see that. `tsc` resolves .d.ts through
      # node_modules as it happens to be installed on the machine, and the unit
      # tests never mount a screen — both stayed green while `expo export` could
      # not resolve the first import in ExpoRoot.js. A real Metro bundle is the
      # only step here that resolves what the app actually imports.
      #
      # android alone is enough: it is module resolution this catches, and the
      # JS graph is the same for both platforms. The export is discarded —
      # `dist/` is gitignored — so this buys the resolution check and nothing
      # else.
      #
      # This step requires every config plugin in app.json to be loadable.
      # expo-sqlite had to reach its SDK 56 version before that was true: 14.0.6
      # shipped no app.plugin.js, so @expo/config-plugins fell back to the
      # package main, which pulls in expo-modules-core's raw src/index.ts and
      # dies in any Node that will not execute TypeScript from node_modules.
      - name: Bundle (Metro)
        run: npx expo export --platform android

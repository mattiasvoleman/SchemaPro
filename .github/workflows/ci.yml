name: CI

# Every `uses:` below names a commit SHA, not a tag. A tag is a movable pointer
# in somebody else's repository: `@v5` is whatever that owner pushed last, and
# a compromised or retagged release runs with this workflow's token and secrets.
# The trailing comment is the release each SHA was resolved from — keep the two
# in step when bumping a pin, or the file stops being readable:
#   git ls-remote https://github.com/actions/checkout refs/tags/v5 'refs/tags/v5^{}'
# The second, peeled ref is what an annotated tag points at; when it prints
# nothing the tag is lightweight and the first line is already the commit.
# Resolved 2026-08-22.

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository, comments on a pull request, reads a package
# registry of GitHub's or calls its API: checkout reads the code, upload-artifact
# goes through the runtime token and not GITHUB_TOKEN, Semgrep is pulled from
# Docker Hub and the audit gate asks the npm registry. So the token reads the
# code and nothing else (the repository's default also grants packages: read,
# which nothing here uses). A job that comes to need more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, tests & coverage
    runs-on: ubuntu-latest
    env:
      # Neither placeholder is needed any more: schema.prisma names no env(),
      # and prisma.config.ts reads DIRECT_URL with a '' fallback, so `prisma
      # validate` and `generate` run without either. They stay harmless —
      # nothing connects to a database in this job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # §2 mandates ≥95%, which remains the target. jest.base.js carries
      # per-metric ratchet floors just under what the suite achieves today, so
      # the gate blocks regression rather than failing on a known gap. Set the
      # COVERAGE_MIN repository variable (or the per-metric ones) to raise them
      # from here without a code change.
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '' }}
      COVERAGE_MIN_LINES: ${{ vars.COVERAGE_MIN_LINES || '' }}
      COVERAGE_MIN_STATEMENTS: ${{ vars.COVERAGE_MIN_STATEMENTS || '' }}
      COVERAGE_MIN_FUNCTIONS: ${{ vars.COVERAGE_MIN_FUNCTIONS || '' }}
      COVERAGE_MIN_BRANCHES: ${{ vars.COVERAGE_MIN_BRANCHES || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22+: @supabase/supabase-js needs a native WebSocket global, which
      # Node 20 lacks — createClient() throws at construction. Matches the
      # runtime floor in package.json engines and the API Dockerfile.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck (production sources)
        run: npm run typecheck

      - name: Typecheck (test sources)
        run: npm run typecheck:test

      # The probes and the RLS runner's scripts in scripts/test import the gateway's own
      # services and are run with `ts-node --transpile-only`, which checks no types: a
      # renamed export (readActiveStaffIds, #340) was a TypeError first seen in the Database
      # job, after the whole RLS suite. Here it is a compile error in a minute.
      - name: Typecheck (scripts/test)
        run: npm run typecheck:scripts

      # Unit + e2e in one run so the reported coverage is the combined figure
      # §2 gates on. Both exercise a mocked Prisma layer — no database needed.
      - name: Unit + integration tests with coverage
        run: npm run test:cov

      # The OpenAPI document (src/openapi): a route missing from it fails, and so does a committed
      # docs/api/openapi.json that is not what the code generates. A step of its own, without coverage:
      # the swagger plugin's compile would be merged into the coverage of the DTOs and controllers and
      # pull the combined figure under the gate (jest.openapi.config.js).
      - name: OpenAPI document (route table and committed file)
        run: npm run test:openapi

      # The verdict of quality-gates.yml's nightly latency job, run on the rows
      # of fourteen real CI runs. latency-gate.mjs imports nothing, so this needs
      # neither autocannon nor the stack, and a change to the gate is proven on
      # the pull request rather than first at night.
      - name: Latency gate verdict (node:test)
        run: node --test scripts/bench/latency-gate.test.mjs

      # The verdict of the nightly solver-corpus job (M5): this tree's CP-SAT work against
      # its floor's, on hand-built weeks. Nothing but Node core, so no Python or OR-Tools.
      - name: Solver corpus gate verdict and calibration script (node:test)
        run: node --test scripts/bench/solve-corpus-gate.test.mjs scripts/bench/solve-corpus-calibrate.test.mjs

      # Which slice of the API's mutants the nightly mutation job takes, and how
      # the files are dealt into slices. The script imports Stryker's
      # instrumenter only when it counts, so this needs no Stryker either.
      - name: Mutation slices (node:test)
        run: node --test scripts/mutation-slice.test.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-coverage
          path: coverage/
          retention-days: 14

  web:
    name: Web — typecheck, build, bundle & browser gates
    runs-on: ubuntu-latest
    env:
      # Placeholder values so `next build` can prerender; real values are
      # injected at deploy time. Never commit real keys.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 24, not 20 like the other jobs: the Vitest suite runs jsdom 30,
      # whose undici 8 does an unguarded
      #   const { markAsUncloneable } = require('node:worker_threads')
      # at import time. That binding only exists from Node 22.10, so on Node 20
      # every jsdom worker dies with "webidl.util.markAsUncloneable is not a
      # function" before a single test runs. 24 is the active LTS and the
      # version the suite is developed against.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # The gate's margin warning (a route or the shared runtime with under
      # 2 KB left): its arithmetic, and the script on a made-up build, so that
      # a warning is proven never to change the exit code. No build needed.
      - name: Bundle margin warning (tests)
        run: node --test scripts/bench/bundle-margin.test.mjs

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      # Vitest unit/component suite with the coverage ratchet. Floors live in
      # vitest.config.ts; raise them via the WEB_COVERAGE_MIN* repository
      # variables as coverage grows — same pattern as the API's jest.base.js.
      - name: Unit tests with coverage
        run: npm run test:unit:cov
        working-directory: web
        env:
          WEB_COVERAGE_MIN: ${{ vars.WEB_COVERAGE_MIN || '' }}
          WEB_COVERAGE_MIN_LINES: ${{ vars.WEB_COVERAGE_MIN_LINES || '' }}
          WEB_COVERAGE_MIN_STATEMENTS: ${{ vars.WEB_COVERAGE_MIN_STATEMENTS || '' }}
          WEB_COVERAGE_MIN_FUNCTIONS: ${{ vars.WEB_COVERAGE_MIN_FUNCTIONS || '' }}
          WEB_COVERAGE_MIN_BRANCHES: ${{ vars.WEB_COVERAGE_MIN_BRANCHES || '' }}

      - name: Build
        run: npm run build
        working-directory: web

      # Tiered budgets on each route's OWN JavaScript, plus a separate budget
      # on the shared framework runtime. §2 specifies a flat 150KB on the total
      # payload, which no route can meet: the framework floor alone is 126KB of
      # react-dom, the Next App Router client and the Turbopack runtime, none
      # of it application code. See the TIERS comment in the script.
      #
      # `npm run bench:bundle:flat` still reports the §2 figure verbatim.
      - name: Bundle size budget
        run: node scripts/bench/bundle-size.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      # §2: WCAG 2.1 AA, zero automated violations.
      - name: Accessibility (axe-core)
        run: npx playwright test --project=a11y
        working-directory: web

      - name: Functional smoke
        run: npx playwright test --project=smoke
        working-directory: web

      # §2: ≤0.1% pixel variance. Baselines are committed and must match the
      # Linux renderer — regenerate them in a Linux container, not on macOS.
      - name: Visual regression
        run: npx playwright test --project=visual --project=visual-mobile
        working-directory: web

      # The menus are server data and not in the bundle the bundle budget
      # counts; they are in every full page load's document instead. This
      # holds the gzipped HTML of one page, /sv/notifications, as each of the
      # four roles gets it (against the e2e stub, less the message catalog)
      # under a ceiling, and prints the figures: with the list reporter,
      # because the github one prints nothing of a passing test.
      # Last of the browser suites, so that a menu that has grown past its
      # ceiling does not hide the visual regression result of the same run:
      # a step that fails stops the ones after it. Needs CI mode (the
      # production build) and has it: CI is set on every runner.
      - name: Document size budget
        run: npx playwright test --project=document-size --reporter=list
        working-directory: web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-playwright-report
          path: web/playwright-report/
          retention-days: 14

  solver:
    name: Solver — pytest & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimization-engine
    env:
      # §2 mandates ≥95%, which remains the target. 81 is a ratchet floor at
      # what the suite achieves today (measured on python:3.12 with the current
      # requirements), so the gate blocks regression rather than failing
      # permanently. Raise it via the ENGINE_COVERAGE_MIN repository variable
      # as coverage grows; never lower it to green a build.
      #
      # The margin is thin — actual is 81.28% — so a small uncovered addition
      # will trip this. That is the intended behaviour, not a misconfiguration.
      COVERAGE_MIN: ${{ vars.ENGINE_COVERAGE_MIN || '81' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: optimization-engine/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: >-
          python -m pytest -q
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=${COVERAGE_MIN}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solver-coverage
          path: optimization-engine/coverage.xml
          retention-days: 14

  rls:
    name: Database — row-level-security policies
    runs-on: ubuntu-latest
    # The probes of the schedule board (the judge's fall file, the possible times held against it) run every start of the week of every
    # world of the file: the job took 17 to 21 minutes on the runs of 2026-11-27 and 20 min 28 s with the fall file's richer worlds. A job
    # that is cut at the limit is a red check that says nothing about the code, so the limit is set well above what a slow runner takes.
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: postgres_local
      # docker-compose.yml declares JWT_SECRET and JWT_ISSUER with `:?`, so
      # compose refuses to interpolate the file without them — even though only
      # the `db` service is started here and nothing reads them.
      JWT_SECRET: ci-rls-secret-not-used-anywhere-else
      JWT_ISSUER: https://ci.invalid/auth/v1
      # Migrations run as the owner; the RLS assertions then connect as
      # app_authenticated, which is the whole point of the gate.
      DATABASE_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
      DIRECT_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22+: @supabase/supabase-js needs a native WebSocket global, which
      # Node 20 lacks — createClient() throws at construction. Matches the
      # runtime floor in package.json engines and the API Dockerfile.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run prisma:generate

      # This gate exists because the e2e suite mocks PrismaService and so
      # cannot see the database contract at all. Three production-breaking
      # bugs shipped behind that blind spot: missing table grants, an identity
      # lookup returning zero rows under RLS, and the SS12000 API silently
      # returning empty payloads. All three are asserted against here.
      #
      # Postgres only. Migrations and seeding run from the host rather than
      # through the `migrate` compose service, for two reasons:
      #
      #   1. `docker compose up --wait db migrate` does NOT wait for a one-shot
      #      container to *finish* — only to be running. Nothing here depends on
      #      migrate's completion the way the `api` service does
      #      (`condition: service_completed_successfully`), so the seed raced
      #      ahead of the migrations and failed with
      #      "The column `requiresApproval` does not exist in the current
      #      database" — a table from the initial migration, a column from a
      #      later one. It passed locally purely because the apply won the race.
      #   2. Using the compose service means building the whole API image just
      #      to run `prisma migrate deploy`, which the host can do directly.
      - name: Start database
        run: docker compose up -d --wait db

      - name: Apply migrations and seed
        run: |
          npm run migrate:deploy
          npm run db:seed

      - name: RLS policy assertions
        run: ./scripts/test/run-rls-tests.sh

      # The assertions above reach Postgres through psql, and the e2e suite
      # mocks PrismaService, so until this step nothing here ran the API's own
      # database layer against a database. Under Prisma 7 that layer is
      # @prisma/adapter-pg over pg's pool, and the tenancy model rests on what
      # they do with a transaction: claims gone at COMMIT on a reused
      # connection, a batch's claims and query in one transaction, READ
      # COMMITTED, a row lock held until commit. The probe asserts those through
      # the real PrismaService and services, plus the error shapes they map (a
      # double booking is a 409, a row in another school a 404) and that time
      # and date columns read raw are the Dates the model API returns. Every
      # assertion is decided by database state, never by a sleep.
      #
      # After the RLS step because it acts in the school its fixtures plant.
      # A pool of two, so the URL's connection_limit is what sizes it; the
      # probe narrows it to one where it needs a connection reused.
      - name: Prisma adapter probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/prisma-adapter-probe.ts

      # Schemat som tabell och i öppna format (round 9, S0): the demo school's
      # and a högstadium's laid timetable out as CSV, Excel, Untis and aSc and
      # back in through the real services under row security, the refusals by
      # name, and what a läsare may do. It lays its lessons with the product's
      # own clash rule and removes everything it wrote.
      - name: Schedule exchange probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-schedule-exchange.ts

      # Vad kom in (P1 Pilotkit, part 2): the school's base data counted against what Generera asks for, as the API role under
      # row security, through the real service. An empty school and a school with a little of everything, each count against the
      # rows the probe made (a class whose lessons are all in a group is not "without a post"), the school's choice about a post
      # with no teacher, another school's rows never counted, a läsare and a TIOARIG läsår. It builds its own schools and drops them,
      # and counts on no number the seed or an earlier step left.
      - name: Intake probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-intake.ts

      # Frågan före en ändring i Direkt som når familjer (P5, beslut 8): a drag, a deletion and the school's answer through the real services as
      # the API role under row security. A refused edit leaves the master lesson, the calendar and the inbox as they were, nothing is asked where
      # nothing reaches families, a switch of mode takes the answer back, the view counts the school's own pupils and guardians, and a läsare cannot
      # answer. It builds its own schools (slug probe-direkt-*) and drops them.
      - name: Direkt question probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-direkt-fragan.ts

      # Optimeringsprofilen (P5): the school's Generera profile through the real service as the API role under row security. The first save
      # makes the row and a later one replaces it, a school reads its own and no other's, and the expedition and a läsare are refused by the
      # database and leave the row as it was. It builds its own schools (slug probe-profil-*) and drops them.
      - name: Optimeringsprofil probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-optimeringsprofil.ts

      # Demoskolans återställning (P1 Pilotkit, part 3): a reset deletes a school, and this shows it never deletes one that is not the
      # demo school. Schools made here from a spec of their own (never `demo-skola`, which the RLS fixtures and the adapter probe have
      # put rows in): a real school untouched row for row, a school with the demo's name and a real person (deactivated, look-alike
      # address, no people) refused with nothing deleted, a huvudman or another school tied to it refused, a person added during the
      # reset waiting on the school's lock, a failure after the delete rolled back, a login kept or not kept. Owner credentials only:
      # the reset is the operator's, and no route reaches it.
      - name: Demo reset probe
        env:
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-demo-reset.ts

      # P3 Personer utan e-postadress: a pupil and a guardian the school has no address for are in the register, the class, the roster of
      # a lesson (and marked there), and the register extract, through the real services under row security, and have no login by any
      # road: the invitation is 409, the mass invitation counts them apart, the database refuses an invitedAt on their row, a teacher
      # needs an address, a file of pupils with none is made once and given the address later, and a removal asks the provider nothing.
      # It makes a school of its own and drops it.
      - name: People with no address probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-personer-utan-adress.ts

      # P3 Första veckan utan operatören: the operator script that makes a school and its first administrator
      # (scripts/operator/new-school.ts, docs/DEPLOYMENT.md §7), run against the database with a stand-in for the
      # Supabase Auth admin API. A dry run writes nothing; --apply makes the school and the administrator in one
      # transaction and attaches the login last; a run that stopped before the login continues from it and makes one
      # school, not two; a finished one does nothing; a slug that holds another school, the wrong host and a login
      # another school holds are refused with the rows untouched. It makes schools of its own and drops them.
      - name: New school probe
        env:
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-new-school.ts

      # Den utgående kön (H3, 20270309090000, omgång 15): mail and push wait in the database and survive a restart. A child process
      # of the probe takes the queue up against a Resend and an Expo that are servers of the probe's own, and is killed with SIGKILL
      # while a mail is on its way (and, apart, a push); the next takes it from there, and every mail reaches Resend once under its
      # Idempotency-Key, every device every notice at most once. Two processes at once take one queue without a row, a mail or a
      # device twice and at one pace, and twelve connections asking for five rows take five. It makes a school of its own and drops it.
      - name: Outgoing queue probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-utkorg.ts

      # Byten och flyttar (round 9, G1): a small högstadium with parallel
      # blocks cut across its classes, laid by the fixture, asked for swaps and
      # chains as a scheduler under row security. Every proposal is checked by
      # a rule of the probe's own over the stored rows, inside the frame and
      # outside the closed hours; a block card goes whole; an applied proposal
      # takes a version, logs each lesson and is undone; a stale, parted or
      # locked proposal and a teacher's principal write nothing. It drops its
      # school.
      - name: Swaps probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-swaps.ts

      # En domare med ord (E1): one drag, three judges. The hand edit (the PATCH and the läsande frågan), a swap's judge and a
      # förläggning's are asked the same drag of every case of src/calendar/__fixtures__/lesson-judge-cases.json over small worlds of
      # their own, over real Postgres, as the API role, and must agree on the rules they share (the clash rule, the stage's ramtid, the
      # class's meal, the rules on whole årskurser); the PATCH that follows says the same and a refusal writes nothing; the verdicts are
      # the file's. web/lib/lesson-judge-mirror.contract.test.ts holds the web's mirror to the same file. It drops its schools.
      - name: Domaren probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-domaren.ts

      # Att lägga (E4): the grundschema's tray counts as the week of förläggningar and Generera do; what stands answers a lesson, a lesson on the tray
      # answers none, a förläggning is said apart. It drops its schools. (probe-att-lagga-motor.ts shows the same against a real engine, by hand.)
      - name: Att lägga probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-att-lagga.ts

      # Att lägga (E4), the write: a lay judged as a hand edit is (the school day, the frame, an exemption), a room the generator would not use, a parked
      # lesson that is the brick only when it answers the post, a lay that names no lesson beside a parked one, and six who lay one picture at once.
      - name: Att lägga, skrivvägen probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=8
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-att-lagga-skrivvagen.ts

      # Lägg det som går (E7a): a proposal that writes nothing and accounts for every brick, Ta in that writes exactly it as locked lessons after a version,
      # every lesson laid one the judge lets through, the scopes, a grundschema that changed since (409 BOARD_FILL_STALE), and Direkt asked before a parked
      # lesson with calendar rows is laid back. A högstadium of six classes with a dozen lessons taken out; it drops its school.
      - name: Lägg det som går probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=8
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-lagg-det-som-gar.ts

      # Möjliga tider (E3): the query that says where a lesson can stand, held against the judge. Every lesson of the judge's
      # fall file (src/calendar/__fixtures__/lesson-judge-cases.json), every fifteenth minute of the week, over real Postgres as the
      # API role: a start the judge lets through is free, a start the query calls free the judge lets through, a closed stretch is
      # refused by the very rule it names, a lesson said to be in the way is the one the judge names, and the best option is the best
      # by the swap search's own measure. Then a högstadium with parallel blocks and teaching groups, a unit moved as one and asked
      # of POST /judge. It drops its schools.
      - name: Möjliga tider probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-mojliga-tider.ts

      # Möjliga tider, the rules the fall file has no world for: a date window that meets another only in a jullov, a room several lessons may
      # share, a room lent to another school or closed by a weekly row, a pupil named on a lesson, ombyte and dusch, a brick, a lesson on the
      # tray, a lesson that stands against a rule on purpose. Every start of the week put to the judge; the query must say what it says. It
      # drops its schools.
      - name: Möjliga tider, reglerna probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-mojliga-tider-regler.ts

      # Salväljaren och en sal som flera lektioner får dela: the prune does not count pupils there, the judge does, so the chooser asks the
      # judge of such rooms. A room it calls free is never one the judge refuses for the room. It drops its school.
      - name: Salväljaren, delade salar probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-salvaljare-delade-salar.ts

      # Undantag med flit (E1b): the table and its trigger (an exemption ends with the time, the lock and the tray, and stays across a room), the
      # PATCH over real Postgres (named, never otherwise; a clash is its own reason; another time asks again; the answer yes keeps it across the
      # changed time), a version restored, a draft discarded, and the schedule file in and out. It drops its schools.
      - name: Undantag probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-undantag.ts

      # Brickorna och ägandet (E4): a lesson moved by hand is locked in sight and is then one of the lessons Generera keeps; a double-booked lesson
      # can be locked and unlocked. It drops its schools.
      - name: Brickor probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-brickor.ts

      # Säkerhetsnät (E9): two writers on one lesson, over real Postgres: the second, which wrote on what it read before the first committed, is refused with the
      # fields and nothing is written over (also thirty times at the same moment, and with the row held by a writer in the middle of its transaction); a request
      # that names only what it writes passes a colleague's change of something else, a request with no expectation is written as before, and a day that is no
      # YYYY-MM-DD is a 400 with a code. It drops its school.
      - name: Säkerhetsnät probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-sakerhetsnat.ts

      # Skriv in förläggningarna (E4b): the year's förläggningar that hold and name a room written to the grundschema as Generera writes them, with
      # no engine; what it leaves and why, what it replaces, the one rewrite of the year at a time. It drops its schools. (probe-skriv-in-motor.ts shows
      # that Generera writes the same lessons from the same rows against a real engine, by hand.)
      - name: Skriv in probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-skriv-in.ts

      # Skriv in förläggningarna i Direkt (E4b, P5 beslut 8): a write that takes lessons off a published calendar asks the school first, once.
      - name: Skriv in i Direkt probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-skriv-in-direkt.ts

      # Anslutningarna (incident 2026-11-23): what a long fetch of a school's week does to the rest of the API. The real
      # school's first Generera answered every other request 500 "Unable to start a transaction in the given time" for 26 s
      # and failed ten background jobs' ticks, because Kontrollera veckan's and Generera's first step reads the week in one
      # transaction, forty round trips that are four seconds at 100 ms, and Prisma gave a transaction 2 s to find a
      # connection. This runs both fetches at once on a högstadium of 228 posts, the round trip made 50 ms long, with a page
      # load every 250 ms and a burst of job ticks beside them, at a pool of 10 (what DEPLOYMENT recommends), 3 and 1: no call
      # fails, and at 10 none waits for a fetch. The refusal of a call that does wait out the pool is read from a real pool,
      # Prisma's P2028 and pg's own timeout, and answered as a 503. It builds its own school and drops it, and sets the pool
      # size itself, so the URL's connection_limit is not what it measures.
      - name: Connections probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-anslutningar.ts

      # Förlagda poster (20270207090000, review of #293, HÖG-1): Generera of a school with a
      # förläggning, through the application Nest builds. The proxy's specs build the service by
      # hand and the e2e specs mock Prisma, so neither saw that an import cycle left the proxy's
      # fourth constructor parameter `undefined` (and @Optional() let Nest pass it on), which made
      # every Generera of such a school a 500. This reads AppModule first, as main.ts does, boots
      # NestFactory.createApplicationContext against this database as the API role, and has the
      # engine on a node:http stub of its own (AI_ENGINE_URL is that stub, set by the probe before
      # the application is read): the proxy holds the context's MasterLessonsService; a
      # förläggning (Tuesday 10:00, one hour, a room) saves on a post of two lessons; Generera
      # sends the post with one lesson left, the förläggning as a fixed lesson and `placements`
      # with the whole demand; the grundschema holds the placed lesson locked, generated and
      # fromPlacement, written again by the next Generera; an engine older than `placements` (422)
      # is sent the request again without it; a handmade lock with the same teacher refuses
      # Generera by name before the engine is woken and writes nothing; and a lunch Generera laid
      # does not refuse the förläggning while one the school placed does. The environment is the
      # e2e suite's (test/setup-env.ts). It drops the school it made.
      - name: Förlagda poster probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
          NODE_ENV: test
          JWT_SECRET: test-secret-not-used-by-the-fake-guard
          JWT_ISSUER: https://test.invalid/auth/v1
          AI_ENGINE_API_KEY: test-key
          AI_ENGINE_TIMEOUT_MS: '15000'
        run: npx ts-node --transpile-only scripts/test/probe-forlagda-poster.ts

      # Förlagda block (20270218090000): a parallel block's lesson through the application Nest builds, on this
      # database as the API role, with the engine on a node:http stub that holds pins. A block of three posts: a
      # lesson saves with a room for one member and the engine's choice for the others, is read, judged by member and
      # refused by rule (LENGTH, COUNT, a teacher two members share, a room that is not the school's) with nothing
      # written; the post's own rule BLOCK stays, at the gateway and in the database; BP409 as the owner (LENGTH,
      # MEMBER); two writers with one baseKey, ten times: one saves and one is BLOCK_PLACEMENTS_STALE. Generera pins
      # every member's lesson at the same place k with the one room named and no lock, writes it locked, generated and
      # fromPlacement, and writes it again; a real lock on a member refuses by name before the engine is woken; a lesson
      # changed while the solver ran is GENERATE_STALE; a post that joins has the lesson, a post that leaves takes only
      # its room row; the block card is not moved by hand and the block can be locked; a room a member chose is not
      # removed. It drops the school it made.
      - name: Förlagda block probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
          NODE_ENV: test
          JWT_SECRET: test-secret-not-used-by-the-fake-guard
          JWT_ISSUER: https://test.invalid/auth/v1
          AI_ENGINE_API_KEY: test-key
          AI_ENGINE_TIMEOUT_MS: '15000'
        run: npx ts-node --transpile-only scripts/test/probe-forlagg-block.ts

      # Förlagda block, the locks (20270218090000): between TWO real sessions, which no single-session test of the RLS suite can see.
      # Four races, ten times each (a placement against a member's change of length, a share, a post that leaves, and a second
      # placement: exactly one is refused, none ends in a set that does not fit, none deadlocks), and three hunts of 300 attempts
      # for deadlocks between two paths that take the post's row and the block's row (a member's lessons against a share; two posts
      # that change blocks the other way; a post that moves in while a placement is written). The run drops the school it made.
      - name: Förlagda block lock probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-forlagg-block-lasen.ts

      # Förlagda block, veckan (C2): what the week's page does to a block, through the real services as the API's role: one PUT of the
      # block's whole list per change, each on the key the answer before it gave (no read between), an undo that is a PUT on the key
      # our last write left (somebody else's write after ours makes it 409 BLOCK_PLACEMENTS_STALE), the rooms a lesson carries, two
      # writers of the first lesson on the one empty key (six rounds: one saves), SCHEDULE_BUSY under Generera's lock, and the
      # indexes the page has to map (a verdict's index is a place in the answer's lessons, a refusal's a place in the list sent).
      # A block whose lessons stopped holding is mended one at a time. The run drops the school it made.
      - name: Förlagda block, veckan probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-forlagg-block-veckan.ts

      # Varningar medan man lägger (D1): 26 små skolor där varje post är lagd för hand, och vad gatewayen säger om dem: lärarens dag
      # (taket, dagarna, sammanhängande undervisning), klassens lunch (med en handlagd måltid, udda och jämna veckor och läsår av många
      # perioder) och salar av ämnets slag, i tavlan, i en posts läsning och i en sparning (aldrig en vägran), och med HR-ordlyden för
      # en läsare utan HR-läs. Utan motor här: lokalt körs samma fall mot den riktiga motorn (AI_ENGINE_URL), där varje varning har ett
      # fall som Generera vägrar av samma skäl och ett som den inte gör. Provet river skolorna det gjorde.
      - name: Förlagg, varningar probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
          NODE_ENV: test
          JWT_SECRET: test-secret-not-used-by-the-fake-guard
          JWT_ISSUER: https://test.invalid/auth/v1
          AI_ENGINE_URL: http://127.0.0.1:1
          AI_ENGINE_API_KEY: test-key
          AI_ENGINE_TIMEOUT_MS: '15000'
          PROBE_NO_ENGINE: '1'
        run: npx ts-node --transpile-only scripts/test/probe-forlagg-varningar.ts

      # Ett par i veckan (D2): en lektion av en post som går varje vecka, lagd på två platser (udda veckor här, jämna veckor där).
      # Sidan håller första halvan i webbläsaren och skriver båda halvorna i EN sats, så här prövas det den bygger på, som API-rollen:
      # paret sparas i en skrivning och är en lektion på veckan; två halvor i en sats godtas av databasen men inte i två satser av en
      # transaktion (FP409 PAIRS), och en ensam halva nekas vem som än skriver den; en ensam halva, fel längd och en jämn halva på en
      # post med udda veckor nekas av tjänsten och ingenting skrivs; en halva utan sal nekas (PAIR_ROOM) vilken halva det än är; ett
      # delat inlägg har ett par per lärare (Bo:s udda och Annas jämna är inget par, TEACHER_PAIRS) och varje lärares del räknar sin
      # egen lektion; ett par på en gammal nyckel är 409 STALE och ingenting skrivs. Skolan som körningen gjorde tas bort.
      - name: Förlagda par, veckan probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
          NODE_ENV: test
          JWT_SECRET: test-secret-not-used-by-the-fake-guard
          JWT_ISSUER: https://test.invalid/auth/v1
          # Nest builds the whole application, whose configuration asks for an engine; this probe asks it nothing (the real engine's half is
          # probe-forlagg-par-motor.ts, which runs by hand), so the address is one nothing listens on.
          AI_ENGINE_URL: http://127.0.0.1:1
          AI_ENGINE_API_KEY: test-key
          AI_ENGINE_TIMEOUT_MS: '15000'
        run: npx ts-node --transpile-only scripts/test/probe-forlagg-par.ts

      # Hela skolans data (K5, 20270114090000): two schools, each with people,
      # lessons, attendance, absence, leave and notices, and an export ordered
      # at one of them, built by the job as the ordering administrator, stored
      # in pieces, fetched and read with the system's unzip: not one row or
      # address of the other school in any file, a protected pupil and
      # teacher in none, who may order, one order in hand, a fetch recorded in
      # the läslogg before the first byte, a file that expires, a stale job
      # taken over, and a registerutdrag of a pupil with a guardian, of a
      # protected pupil and of a teacher. It removes both schools.
      - name: Whole-school export probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-school-export.ts

      # Måltidskollen (D8, 20270123090000): the portions of each lunch sitting
      # through the real MealCountsService, MealLetterJob and JobRunner on the
      # API's role: the counts of a school with sittings, absence before and
      # after the cut-off, an activity over lunch and a pedagogisk lunch; the
      # settings (Drift writes, the läsare does not, a letter without its
      # address is refused by name); the file as Excel reads it; and the
      # daily letter: not a second before the cut-off, once a day, the same
      # figures however late, left open when the mail is not taken and tried
      # again inside the three hours, none for a day without a sitting, one
      # from two passes at once. It removes the school it made.
      - name: Meal counts probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-maltidskollen.ts

      # Skolans kalender (P4): a whole calendar of lov in one call through the
      # real SchoolBreaksService on the API's role. The dry run counts what the
      # write then takes, to the lesson (a cancelled lesson and one that has
      # begun stay), and writes nothing; a list with one row outside the läsår
      # writes none and names the row; the same list again is unchanged and
      # takes no lesson; a week for some årskurser takes those groups' lessons
      # only; a row with an id moves that lov; a teacher is refused by the
      # table. It removes the school it made.
      - name: School calendar probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-skolans-kalender.ts

      # Klassens måltid håller veckor (20270209090000): the oracle over the
      # calendar, date by date through a läsår that starts on a Saturday, of a
      # school whose classes eat at another time in the autumn and in the spring
      # (and one week of another in October), published through the real
      # CalendarService; the publication's snapshot keeps the weeks and a
      # calendar materialised from it alone is the live one, instant for instant;
      # a meal placed by hand takes the day over, and the placement that loses a
      # race at the exclusion constraint is a 409; the swap board reads the meal
      # that holds the date. Nothing writes a date yet, so the rows are planted as
      # the owner. It removes the school it made.
      - name: Meal per term probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-maltid-per-termin.ts

      # Analys och planering (K1, 20270130090000): the löneunderlag of a
      # person who has left, through the real AnalysisService, statement E and
      # the vikarie export on the API's role. A teacher deactivated mid-period
      # is booked on the lessons over by the stamp (D6's rule) and on the
      # uppdrag to the day before, not on the ten days the lessons still
      # carrying her would give; a period wholly after gives no line and no
      # file row, and a notice; a lesson later the same day is not hers; a
      # vikarie's cover after the stamp is not his; a person made active again
      # is booked for what they held before the leave and after it and for
      # nothing between (UserDeactivations, 20270210090000); a last working day
      # named through UsersService moves the start of the period; and two
      # administrators flipping one person at once leave periods that never
      # overlap. It removes the school it made.
      - name: Analysis and planning probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=2
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-analysis.ts

      # Lokal (K3, 20270204091000): resources that are not rooms and the associations that hire a
      # room after school, through the real services on the API's role. A resource booked past
      # its quantity answers 409 by name (the trigger's refusal as the adapter delivers it), a
      # series is previewed against lessons, bookings, the ramtid and a closure and registered
      # with or without the days that clash, its days are bookings of the room a teacher cannot
      # book over, two registrations at once end in one 409, a lesson that lands in a booked room
      # is listed and told to the expedition and not to the läsare, the report and its CSV, and
      # forty rooms with a term of Tuesdays each against 24 000 lessons registered in under 2 s
      # (or, on a slower runner, eighty empty transactions a series, measured first on the same connection). It removes its school.
      - name: Lokal probe
        env:
          DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          PROBE_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: npx ts-node --transpile-only scripts/test/probe-lokal.ts

      # Huvudman (20261212090000): every GET a school administrator reaches,
      # through the real gateway and this database, as the roller school's
      # own läsare and as the huvudman's reader with that school chosen. Each
      # answers both alike (status, shape, lengths), or is named in the spec's
      # DIFFERS with why; a route that answers the reader otherwise fails here.
      # The spec runs only with a database, which this job is the one to have.
      - name: Huvudman's reader against the läsare (every GET)
        env:
          HUVUDMAN_SWEEP_DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
        run: TZ=UTC npx jest test/huvudman-gets.e2e-spec.ts --selectProjects e2e

      # Skyddad identitet (20270107090000): every file of people, built as the
      # product builds it — the gateway's exports through the real gateway,
      # the web's files by the web's own builders fed by it — for the RLS
      # fixtures' school with a marked pupil, his guardian, a marked guardian
      # and a marked teacher; then the sync's own apply marks a pupil under
      # its principal and lifts it again. Neither the pupil nor his guardian
      # may be in any file. And the sync end to end against a mock register
      # (a school of its own, removed after): the night marks, a mark by hand
      # stands through the register's "Ingen", a pupil typed in by hand is
      # marked by the night, and no finished run names anybody.
      - name: Protected identity in every file
        env:
          SKYDDAD_DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          SKYDDAD_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: TZ=UTC npx jest test/skyddad-identitet.e2e-spec.ts test/skyddad-identitet-synk.e2e-spec.ts --selectProjects e2e --runInBand

      # Schemavisarens lägen (20270118090000): the viewer's open routes asked
      # as a visitor, a pupil, a guardian, a teacher and an administrator, in
      # two schools planted for the run and removed after, through the real
      # gateway and the real database under row security: the mode of each
      # kind, a viewer for staff, hidden schedules, a protected identity, the
      # rate limit on links that do not exist, the frames and the calendar
      # feeds.
      - name: Schemavisaren's lägen through the real gateway
        env:
          LAGEN_DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@localhost:5432/schemapro?schema=public&connection_limit=4
          LAGEN_OWNER_URL: postgresql://postgres:postgres_local@localhost:5432/schemapro
        run: TZ=UTC npx jest test/schemavisaren-lagen.e2e-spec.ts --selectProjects e2e --runInBand

      - name: Database logs
        if: failure()
        run: docker compose logs db --no-color --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v

  security:
    name: Security — dependency audit & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22+: @supabase/supabase-js needs a native WebSocket global, which
      # Node 20 lacks — createClient() throws at construction. Matches the
      # runtime floor in package.json engines and the API Dockerfile.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # §2 allows 0 Critical / High / Medium. npm audit's lowest failing level
      # is `moderate`, which is npm's name for Medium. All three packages go
      # through the same gate: the failing threshold of plain
      # `npm audit --audit-level=moderate`, plus a documented, EXPIRING allowlist
      # for advisories that have no patched release anywhere (npm audit itself
      # cannot ignore a specific advisory, and dropping the level would hide
      # future findings too). Suppressions are printed on every run and go red
      # again at expiry — see scripts/security/audit-allowlist.json for the
      # justifications. Until 2026-10-06 the API and web steps ran bare
      # `npm audit`; the braces advisory, which no release fixes, made the
      # bare form permanently red for every branch.
      - name: npm audit (API)
        run: node scripts/security/npm-audit-gate.mjs api

      - name: npm audit (web)
        run: node scripts/security/npm-audit-gate.mjs web

      - name: npm audit (mobile)
        run: node scripts/security/npm-audit-gate.mjs mobile

      - name: pip-audit (solver)
        run: |
          # Pinned like everything else here. The advisory data is fetched at
          # run time, so a fixed scanner version still sees today's CVEs.
          pip install pip-audit==2.10.1
          pip-audit --requirement optimization-engine/requirements.txt --strict

      # Static analysis across every package. `--error` makes any finding fail
      # the job; the rulesets cover OWASP Top 10 patterns for TS/JS and Python.
      #
      # The engine runs as a plain container, not through semgrep/semgrep-action.
      # That action is deprecated and starts returntocorp/semgrep-agent:v1, whose
      # Semgrep 1.36.0 cannot read today's registry rules: it raised `invalid
      # rule severity value: MEDIUM`, the container still exited 0, and the step
      # went green having scanned nothing (job 104116906318). Here semgrep is
      # the container's own process and `run:` executes under `bash -e`, so any
      # non-zero exit fails the step — a finding, a config the engine rejects,
      # rules it cannot fetch, an engine that is killed.
      #
      # Pinned to the multi-arch index digest. The tag in front only names the
      # release the digest was resolved from; Docker pulls by the digest. To
      # bump, take the top-level Digest from
      #   docker buildx imagetools inspect semgrep/semgrep:<version>
      # Resolved 2026-09-15. The same command reproduces the gate locally, run
      # in a `git archive HEAD` export: a working tree carries node_modules and
      # build output that this checkout never has.
      #
      # Keep the mount at /src. The checkout belongs to the runner's user and
      # semgrep runs as root, so git would call the repository dubiously owned;
      # the image's /root/.gitconfig trusts exactly /src, which is what lets
      # semgrep list the tracked files. Mounted anywhere else the scan exits 2.
      - name: Semgrep SAST
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
          semgrep scan
          --config=p/owasp-top-ten
          --config=p/typescript
          --config=p/javascript
          --config=p/python
          --config=p/secrets
          --config=p/nestjs
          --config=p/react
          --error --metrics=off

  mobile:
    name: Mobile — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Pin npm explicitly. Node 20 bundles npm 10, but npm 10 and 11 resolve
      # optional peer dependencies differently and produce mutually incompatible
      # lockfiles: an npm 11 lock fails npm 10 with "Missing @swc/helpers", and
      # an npm 10 lock fails npm 11 with "Missing @parcel/watcher-*". Whichever
      # npm generates the committed lock must be the one CI installs with.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      # The app holds attendance for real children in an offline queue on a
      # tablet several teachers share, and a mistake there is invisible until
      # the register is already wrong. It went untested for far too long.
      # Through the script, not `npx jest` directly: the script carries the
      # `TZ=UTC` pin, and a date test that agrees with the runner's own zone
      # compares a value to itself.
      - name: Unit tests
        run: npm run test:cov -- --ci

      # Nothing in this pipeline had ever bundled the app, and so nothing
      # noticed when mobile/package.json stopped describing it. expo-router
      # imports react-native-safe-area-context, expo-linking and
      # react-native-screens at runtime; two were absent from the manifest
      # altogether and the third was held a whole major back by an `overrides`
      # line. Neither gate above can see that. `tsc` resolves .d.ts through
      # node_modules as it happens to be installed on the machine, and the unit
      # tests never mount a screen — both stayed green while `expo export` could
      # not resolve the first import in ExpoRoot.js. A real Metro bundle is the
      # only step here that resolves what the app actually imports.
      #
      # android alone is enough: it is module resolution this catches, and the
      # JS graph is the same for both platforms. The export is discarded —
      # `dist/` is gitignored — so this buys the resolution check and nothing
      # else.
      #
      # This step requires every config plugin in app.json to be loadable.
      # expo-sqlite had to reach its SDK 56 version before that was true: 14.0.6
      # shipped no app.plugin.js, so @expo/config-plugins fell back to the
      # package main, which pulls in expo-modules-core's raw src/index.ts and
      # dies in any Node that will not execute TypeScript from node_modules.
      - name: Bundle (Metro)
        run: npx expo export --platform android

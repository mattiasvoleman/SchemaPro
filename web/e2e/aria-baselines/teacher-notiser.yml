- main:
  - heading "Notiser" [level=1]
  - paragraph: Välj vad som skickas till dig utanför Rastra Schema
  - region "E-post och push":
    - heading "E-post och push" [level=2]
    - text: Det du slår av skickas inte som e-post eller push. Notisen finns ändå kvar här i Rastra Schema.
    - list:
      - listitem:
        - text: Inställda lektioner
        - switch "Inställda lektioner" [checked]
      - listitem:
        - text: Sammanfattningar av avbokningar
        - switch "Sammanfattningar av avbokningar" [checked]
      - listitem:
        - text: Lektioner som blir av igen
        - switch "Lektioner som blir av igen" [checked]
      - listitem:
        - text: Vikarier på mina lektioner
        - paragraph: Dina egna vikariepass kommer alltid fram, vad du än väljer här.
        - switch "Vikarier på mina lektioner" [checked]
      - listitem:
        - text: Självstudier
        - switch "Självstudier" [checked]
      - listitem:
        - text: Avbokade vikariepass
        - paragraph: Skickas alltid, så att du inte går till ett pass som inte längre är ditt.
        - switch "Avbokade vikariepass" [checked] [disabled]
      - listitem:
        - text: Byte av sal
        - switch "Byte av sal" [checked]
      - listitem:
        - text: Beslut om lokalbokning
        - switch "Beslut om lokalbokning"

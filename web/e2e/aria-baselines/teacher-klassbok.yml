        - listitem:
          - text: 08:10–08:40 Mentorstid
          - paragraph: Anna Lind · Sal 101
          - paragraph: Inget skrivet.
    - paragraph: Med i klassboken är klassens egna lektioner och de lektioner där någon av klassens elever deltar, till exempel språkval. Notiser till vikarier står aldrig här.

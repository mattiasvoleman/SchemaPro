          - text: 09:25–10:25 Matematik
          - paragraph: Eva Holm (vikarie) · Sal 101
          - paragraph: "Ämne: Bråk och decimaltal"
        - listitem:
          - text: 13:00–14:00 Idrott och hälsa
          - paragraph: David Berg · Idrottshallen
          - paragraph: Inget skrivet.
    - region "tisdag <datum>":
      - heading "tisdag <datum>" [level=3]
      - list:
        - listitem:
          - text: 08:10–09:10 Engelska
          - paragraph: Anna Lind · Sal 101
          - paragraph: "Läxa: Glosor kapitel 3"
        - listitem:
          - text: 09:25–10:25 Biologi
          - paragraph: Cecilia Ås · NO-salen
          - paragraph: Inget skrivet.
    - region "onsdag <datum>":
      - heading "onsdag <datum>" [level=3]
      - list:
        - listitem:
          - text: 10:40–11:40 Svenska Inställd
          - paragraph: Anna Lind · Sal 101
          - paragraph: Inget skrivet.
        - listitem:
          - text: 13:00–14:00 Matematik
          - paragraph: Ingen lärare · Sal 101
          - paragraph: "Läxa: Uppgift 5.1–5.4"
    - region "torsdag <datum>":
      - heading "torsdag <datum>" [level=3]

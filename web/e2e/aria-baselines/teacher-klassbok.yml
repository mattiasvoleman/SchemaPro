- main:
  - heading "Klassbok" [level=1]
  - paragraph: En klass lektioner under en period, med ämne och läxa
  - button "Skriv ut"
  - text: Klass eller grupp
  - combobox "Klass eller grupp":
    - option "Välj klass eller grupp"
  - text: Från
  - textbox "Från":
    - /placeholder: åååå-mm-dd
    - text: <datum>
  - button "Öppna kalender för Från"
  - text: Till
  - textbox "Till":
    - /placeholder: åååå-mm-dd
    - text: <datum>
  - button "Öppna kalender för Till"

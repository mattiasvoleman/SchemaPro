- main:
  - heading "Ledighetsansökningar" [level=1]
  - paragraph: Besluta om ledighet och bestäm vad elevens mentor får besluta om
  - status:
    - paragraph: Mentorn beslutar om ledighet på högst 3 skoldagar
    - text: Rektor har delegerat beslut om kortare ledighet till elevens mentor. Längre ansökningar, och en elev utan mentor de dagarna, beslutar rektor. Beslutat <datum> av Rut Rektorsson, Delegationsordning, punkt 4.2.
    - button "Ändra delegering"
  - tablist "Visa ansökningar":
    - tab "Väntar" [selected]
    - tab "Beviljad"
    - tab "Avslagen"
  - region "Väntar på rektor":
    - heading "Väntar på rektor" [level=2]
    - list:
      - listitem:
        - paragraph: Ines Vik (7A) <datum>–<datum>
        - paragraph: "5 skoldagar · Rektor beslutar: mer än 3 skoldagar"
        - paragraph: "Läsåret <läsår>: ingen ledighet beviljad, 1 ansökan till väntar"
        - paragraph: Resa
        - paragraph: Ansökt av Tom Vik · <datum>
        - text: Kommentar till vårdnadshavaren , Ines Vik, <datum>–<datum> (valfritt)
        - textbox "Kommentar till vårdnadshavaren , Ines Vik, <datum>–<datum> (valfritt)"
        - button "Bevilja Ines Vik, <datum>–<datum>": Bevilja
        - button "Avslå Ines Vik, <datum>–<datum>": Avslå
  - region "Hos elevens mentor":
    - heading "Hos elevens mentor" [level=2]
    - list:
      - listitem:
        - paragraph: Ella Nord (7A) <datum>–<datum>
        - paragraph: "3 skoldagar · Mentorn beslutar: Anna Lind"
        - paragraph: "Läsåret <läsår>: ingen ledighet beviljad, 1 ansökan till väntar"
        - paragraph: Familjeresa till mormor
        - paragraph: Ansökt av Sara Nord · <datum>
        - text: Kommentar till vårdnadshavaren , Ella Nord, <datum>–<datum> (valfritt)
        - textbox "Kommentar till vårdnadshavaren , Ella Nord, <datum>–<datum> (valfritt)"
        - button "Bevilja Ella Nord, <datum>–<datum>": Bevilja
        - button "Avslå Ella Nord, <datum>–<datum>": Avslå
  - region "Så tar skolan emot ledighetsansökningar":
    - heading "Så tar skolan emot ledighetsansökningar" [level=2]
    - text: Valen gäller ansökningar som skrivs efter att du har sparat. Är inget valt tar skolan emot ansökningar som förut.
    - checkbox "Be alla vårdnadshavare samtycka"
    - text: Be alla vårdnadshavare samtycka
    - paragraph: En ansökan går till beslut först när alla vårdnadshavare med aktiv vårdnad har samtyckt. Den som ansökte räknas som att ha samtyckt, och de andra får en notis. Ett nej avslutar ansökan.
    - text: Minsta antal dagar före första dagen
    - textbox "Minsta antal dagar före första dagen"
    - paragraph: Kalenderdagar, 1 till 90. Lämna tomt för inget minimum.
    - text: En ansökan som kommer för sent
    - combobox "En ansökan som kommer för sent" [disabled]:
      - option "Neka – formuläret tar inte emot den" [selected]
      - option "Flagga – den som beslutar ser att den kom sent"
    - paragraph: Gäller när ett minsta antal dagar är valt.
    - text: Kontakt under ledigheten
    - combobox "Kontakt under ledigheten":
      - option "Av – skolan frågar inte efter någon kontakt" [selected]
      - option "Frivillig – familjen kan lämna en kontakt"
      - option "Obligatorisk – en ansökan kräver en kontakt"
    - paragraph: Namn, telefon och relation till barnet. Uppgifterna tillhör en tredje part och syns bara för familjen, administratörer och mentorn som beslutar, aldrig i notiser eller e-post.
    - button "Spara valen" [disabled]

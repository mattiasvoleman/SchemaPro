- main:
  - article:
    - heading "Tillgänglighetsredogörelse för SchemaPro" [level=1]
    - paragraph: "{Huvudmannens namn} står bakom SchemaPro, skolans tjänst för schema, närvaro och frånvaro. Vi vill att så många som möjligt ska kunna använda tjänsten. Den här redogörelsen beskriver hur SchemaPro uppfyller lagen om tillgänglighet till digital offentlig service, vilka tillgänglighetsproblem vi känner till och hur du kan rapportera brister till oss så att vi kan åtgärda dem."
    - paragraph: "Redogörelsen gäller webbtjänsten SchemaPro: inloggningen och alla sidor för skolans administratörer, lärare, elever och vårdnadshavare. Den gäller inte SchemaPros mobilapp, som ännu inte finns i App Store eller Google Play. Appen får en egen redogörelse när den publiceras där."
    - heading "Hur tillgänglig är tjänsten?" [level=2]
    - paragraph: Vi är medvetna om att delar av tjänsten inte är helt tillgängliga. Se avsnittet om innehåll som inte är tillgängligt nedan.
    - heading "Vad kan du göra om du inte kan använda delar av tjänsten?" [level=3]
    - paragraph: "Om du behöver innehåll från SchemaPro som inte är tillgängligt för dig kan du kontakta oss:"
    - list:
      - listitem: "E-post: {e-postadress}"
      - listitem: "Telefon: {telefonnummer}"
    - paragraph: "Vi svarar normalt inom {antal} arbetsdagar."
    - heading "Rapportera brister i tjänstens tillgänglighet" [level=2]
    - paragraph: "Vi strävar hela tiden efter att förbättra tjänstens tillgänglighet. Om du upptäcker problem som inte beskrivs på den här sidan, eller om du anser att vi inte uppfyller lagens krav, meddela oss så att vi får veta att problemet finns: {e-postadress eller länk till formulär}."
    - heading "Tillsyn" [level=2]
    - paragraph:
      - text: Myndigheten för digital förvaltning (Digg) har ansvaret för tillsyn över lagen om tillgänglighet till digital offentlig service. Om du inte är nöjd med hur vi hanterar dina synpunkter kan du
      - link "göra en anmälan till Digg":
        - /url: https://www.digg.se/analys-och-uppfoljning/lagen-om-tillganglighet-till-digital-offentlig-service-dos-lagen/anmal-bristande-tillganglighet
      - text: .
    - heading "Teknisk information om tjänstens tillgänglighet" [level=2]
    - paragraph: SchemaPro är delvis förenlig med lagen om tillgänglighet till digital offentlig service, på grund av de brister som beskrivs nedan. Kraven är nivå AA i WCAG 2.1, som standarden EN 301 549 hänvisar till.
    - heading "Innehåll som inte är tillgängligt" [level=2]
    - paragraph: Det innehåll som beskrivs nedan är på ett eller annat sätt inte helt tillgängligt.
    - heading "Bristande förenlighet med lagkraven" [level=3]
    - list:
      - listitem: Tjänsten har inte testats av en person som använder skärmläsare. Den automatiska granskningen och ett manus för testet finns, men själva testet med VoiceOver och NVDA återstår. Tills det är gjort kan det finnas brister för den som använder skärmläsare som de automatiska testerna inte hittar (WCAG 1.3.1 Information och relationer, 2.4.3 Fokusordning, 4.1.2 Namn, roll, värde).
      - listitem: Schemat som administratören exporterar som PDF är inte taggat, så en skärmläsare kan inte läsa ut dess tabell (WCAG 1.3.1 Information och relationer). Samma schema går att läsa på webben och att exportera som kalenderfil.
    - heading "Innehåll som inte omfattas av lagen" [level=3]
    - paragraph: Vi känner inte till något innehåll i SchemaPro som är undantaget från lagen.
    - heading "Hur vi har testat tjänsten" [level=2]
    - paragraph: "Vi har gjort en självskattning (intern testning) av SchemaPro:"
    - list:
      - listitem: Automatisk granskning med verktyget axe mot WCAG 2.1 nivå A och AA, på varje sida i tjänsten och som var och en av rollerna administratör, lärare, elev och vårdnadshavare, i ljust och mörkt tema och i dator- och mobilbredd. Granskningen körs vid varje ändring av tjänsten. Den granskar sidorna som de ser ut när de har laddats. Dialogrutor och menyer som öppnas med ett klick granskas inte automatiskt, utom huvudmenyn på mobil och notismenyn. De ingår i skärmläsartestet, som återstår.
      - listitem: Granskning av vad hjälpmedel får veta om de viktigaste sidorna (namn, roller, rubriker och meddelanden), med sparade jämförelser som visar varje ändring.
      - listitem: Tester av tangentbordsanvändning, synligt fokus och kontrast för inloggningen och schemaläggningen.
      - listitem: Ett manus för testet med skärmläsare, med vad som ska höras i varje steg för de fyra rollerna. Själva testet återstår (se ovan).
    - paragraph: Senaste bedömningen gjordes den <datum>.
    - paragraph: Redogörelsen uppdaterades senast den <datum>.

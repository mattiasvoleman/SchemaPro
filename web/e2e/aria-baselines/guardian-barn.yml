- main:
  - heading "Mina barn" [level=1]
  - paragraph: Se schemat, anmäl frånvaro och ansök om ledighet för dina barn
  - region "Schema för Ella":
    - heading "Schema för Ella" [level=2]
    - text: Veckan som skolan har publicerat, med skolans tider.
    - tablist "Visa":
      - tab "I dag" [selected]
      - tab "Vecka"
    - group "Välj barn":
      - button "Ella" [pressed]
      - button "Hugo"
    - region "Onsdag <datum>":
      - heading "Onsdag <datum>" [level=3]
      - list:
        - listitem: 09:10–09:25 Förmiddagsrast
        - listitem: 10:40–11:40 Svenska Inställd Sal 101
        - listitem: 11:40–12:10 Lunch
        - listitem: 13:00–14:00 Matematik Vikarie Sal 101
  - region "Anmäl frånvaro":
    - heading "Anmäl frånvaro" [level=2]
    - text: Skolan och berörda lärare ser anmälan direkt. Barn
    - combobox "Barn":
      - option "Ella Nord" [selected]
      - option "Hugo Nord"
    - text: Datum
    - textbox "Datum":
      - /placeholder: åååå-mm-dd
      - text: <datum>
    - button "Öppna kalender för Datum"
    - text: Orsak
    - combobox "Orsak":
      - option "Sjuk" [selected]
      - option "Läkarbesök"
      - option "Övrigt"
    - text: Heldag
    - switch "Heldag" [checked]
    - text: Anteckning (valfritt)
    - textbox "Anteckning (valfritt)"
    - button "Anmäl frånvaro"
  - region "Anmäld frånvaro":
    - heading "Anmäld frånvaro" [level=2]
    - list:
      - listitem:
        - paragraph: Ella Nord
        - text: fre <datum> · 13:00–15:00 Läkarbesök
        - button "Ta bort anmälan för Ella Nord, fre <datum>"
      - listitem:
        - paragraph: Hugo Nord
        - text: ons <datum> · Heldag Sjuk
        - button "Ta bort anmälan för Hugo Nord, ons <datum>"
  - region "Ansök om ledighet":
    - heading "Ansök om ledighet" [level=2]
    - text: Rektor beslutar, eller elevens mentor när rektor har delegerat beslut om kortare ledighet. Barn
    - combobox "Barn":
      - option "Ella Nord" [selected]
      - option "Hugo Nord"
    - text: Från
    - textbox "Från":
      - /placeholder: åååå-mm-dd
      - text: <datum>
    - button "Öppna kalender för Från"
    - text: Till
    - textbox "Till":
      - /placeholder: åååå-mm-dd
      - text: <datum>
    - button "Öppna kalender för Till"
    - text: Anledning
    - textbox "Anledning"
    - button "Skicka ansökan" [disabled]
  - region "Ledighetsansökningar":
    - heading "Ledighetsansökningar" [level=2]
    - list:
      - listitem:
        - text: Ella Nord Väntar
        - paragraph: <datum>–<datum>
        - paragraph: Familjeresa till mormor
      - listitem:
        - text: Hugo Nord Beviljad
        - paragraph: <datum>
        - paragraph: Uppkörning för moped
        - paragraph: Beslutad av rektor

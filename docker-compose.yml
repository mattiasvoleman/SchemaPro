# =============================================================================
# SchemaPro — local development stack
#
#   docker compose up --build
#
# Services:
#   db       PostgreSQL 16 with RLS roles bootstrapped (scripts/db-init)
#   migrate  One-shot: applies Prisma migrations as the DB owner
#   api      NestJS gateway (connects as least-privilege app_authenticated)
#   solver   Python FastAPI + OR-Tools optimization engine
#
# Secrets: every sensitive value is read from the host environment (or a root
# .env file next to this compose file). The defaults below are for local
# development ONLY — never reuse them anywhere else.
# =============================================================================

name: schemapro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schemapro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schemapro"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      # Migrations run as the owner; the API itself never uses this role.
      # Prisma 7's CLI reads only DIRECT_URL, through prisma.config.ts.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_local}@db:5432/schemapro?schema=public
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_local}@db:5432/schemapro?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:19006}
      # Least-privilege connection — RLS enforced on every query.
      #
      # connection_limit is the API's own pool, and it is set rather than left
      # to a default. The pool is pg's under @prisma/adapter-pg, and pg reads
      # nothing from the URL's query string: src/database/pool-config.ts maps
      # connection_limit onto the pool's `max`. Without it pg opens at most 10 —
      # no longer Prisma 5's physical cores × 2 + 1, which was three or five on
      # the 2-CPU runner the latency gate uses. Every request holds a pooled
      # connection through its interactive transactions, so a pool smaller than
      # the concurrency the stack is driven with is a queue in front of every
      # query. 25 is that concurrency — scripts/bench/api-latency.mjs's own.
      #
      # No DIRECT_URL: that is the owner connection migrate uses, and the API
      # never reads it.
      DATABASE_URL: postgresql://app_authenticated:app_authenticated_local@db:5432/schemapro?schema=public&connection_limit=${DATABASE_POOL_SIZE:-25}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (your Supabase JWT secret) in the environment}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER (<SUPABASE_URL>/auth/v1) — the API reads its JWKS from it}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-authenticated}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AI_ENGINE_URL: http://solver:8000
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:-local-dev-shared-key-not-a-secret-0000}
      AI_ENGINE_TIMEOUT_MS: ${AI_ENGINE_TIMEOUT_MS:-60000}
      # Overridable like every other value here. The latency benchmark drives
      # far more traffic than a dev limit allows, and a run that measures the
      # throttler instead of the API is worthless — see scripts/bench/.
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      solver:
        condition: service_started

  solver:
    build: ./optimization-engine
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      API_KEY: ${AI_ENGINE_API_KEY:-local-dev-shared-key-not-a-secret-0000}
      ALLOWED_ORIGINS: http://api:4000
      SOLVER_TIMEOUT_SECONDS: ${SOLVER_TIMEOUT_SECONDS:-60}

volumes:
  db-data:
